<style>
:root{
  /* 配色取自嘉禾益主視覺：品牌紅、黃金泡菜黃、高麗菜綠、奶油米色 */
  --bg:#FFF2CF; --surface:#FFFBF0; --ink:#3A1A14; --muted:#7A5A50; --line:#F0D9A8;
  --primary:#AC2A2A; --primary-ink:#FFFFFF; --primary-soft:#FBE3DF;
  --marigold:#FDD901; --bad:#C2453A; --good:#4F8A2B; --leaf:#8DBE36;
  --display:"Huninn","jf open 粉圓","PingFang TC","Noto Sans TC",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1414; --surface:#281B1A; --ink:#F6EBDD; --muted:#C2A89E; --line:#4A302D;
    --primary:#F07B6E; --primary-ink:#1E1414; --primary-soft:#3A2321; --good:#8CC56A; --bad:#EF7A6E;
  }
}
:root[data-theme="dark"]{
--bg:#1E1414; --surface:#281B1A; --ink:#F6EBDD; --muted:#C2A89E; --line:#4A302D;
  --primary:#F07B6E; --primary-ink:#1E1414; --primary-soft:#3A2321; --good:#8CC56A; --bad:#EF7A6E;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19.2px;line-height:1.6;-webkit-text-size-adjust:100%}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--surface);position:relative;display:flex;flex-direction:column}
.page{display:none;flex:1;flex-direction:column}
.page.on{display:flex}

body.booting .overlay,body.booting .btxt{visibility:hidden}
/* Banner */
.banner{position:relative;aspect-ratio:3/1;background:var(--primary);overflow:hidden;flex:none}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .btxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 20px;text-align:center;
  font-family:var(--display);font-size:clamp(24px, 7.2vw, 33.6px);color:#fff;letter-spacing:.04em;
  background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.3px);background-size:14px 14px}
.banner.has-img .btxt{display:none}

/* Stage with editable background + overlay text */
.stage{position:relative;flex:1;min-height:420px;display:flex;flex-direction:column;overflow:hidden}
.stage .bg{position:absolute;inset:0;background-size:cover;background-position:center;
  background-color:#FFF2CF;
  background-image:radial-gradient(color-mix(in srgb,var(--primary) 16%,transparent) 1.5px,transparent 1.6px);background-size:18px 18px}
.stage .scrim{position:absolute;inset:0;display:none;background:linear-gradient(180deg,rgba(10,14,24,0) 25%,rgba(10,14,24,.72) 100%)}
/* 底圖區的文字顏色：
   - 沒有底圖時，底色固定為淺米色，文字固定為深色（不受手機深色模式影響）
   - 有底圖時，依「文字顏色」設定：白色字（加暗色漸層）或深色字（加淺色漸層）；「自動」依底圖亮度判斷 */
.stage{--ink:#3A1A14;--muted:#7A5A50;--surface:#FFFBF0;--line:#F0D9A8;--primary:#AC2A2A;--primary-ink:#FFFFFF;--primary-soft:#FBE3DF;--bad:#C2453A}
.stage .overlay{color:var(--ink)}
.stage.has-img .scrim{display:block}
.stage.has-img .overlay{color:#fff}
.stage.has-img .overlay .sub,.stage.has-img .overlay .note{color:rgba(255,255,255,.88)}
.hero{position:relative;display:block;width:calc(100% - 32px);max-width:440px;margin:14px auto 0;height:auto;border-radius:18px;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.stage.hero-mode .bg{background:#FFF2CF}
.stage.hero-mode .overlay{color:#3A1A14;padding-top:8px}
.stage.hero-mode .overlay .sub{color:#7A5A50}
.stage.hero-mode .rules{color:#3A1A14}
.overlay{position:relative;margin-top:auto;padding:32px 24px 36px}
.overlay h1{font-family:var(--display);font-weight:400;font-size:clamp(36px, 10.8vw, 48px);line-height:1.2;margin:0 0 10px;letter-spacing:.02em}
.overlay .sub{margin:0 0 22px;color:var(--muted);font-size:20.4px}
.overlay .sub.soldout{color:var(--bad);font-weight:700}
.stage.has-img .overlay .sub.soldout{color:#FFD7D3}
.rules{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:8px;font-size:18px}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:2px;background:var(--marigold);transform:rotate(45deg)}

.btn{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;border:0;border-radius:14px;
  background:var(--primary);color:var(--primary-ink);font-family:var(--display);font-size:24px;letter-spacing:.06em;cursor:pointer;
  box-shadow:0 4px 0 color-mix(in srgb,var(--primary) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--primary) 60%,#000)}
.stage.has-img .btn.ghost{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.stage.has-img:not(.tone-dark) .demo-flag{color:rgba(255,255,255,.75)}
/* 深色字模式（淺色底圖）*/
.stage.has-img.tone-dark .scrim{display:block;background:linear-gradient(180deg,rgba(251,248,242,0) 20%,rgba(251,248,242,.82) 62%,rgba(251,248,242,.9) 100%)}
.stage.has-img.tone-dark .overlay{color:var(--ink)}
.stage.has-img.tone-dark .overlay .sub,.stage.has-img.tone-dark .overlay .note{color:var(--muted)}
.stage.has-img.tone-dark .overlay .sub.soldout{color:var(--bad)}
.stage.has-img.tone-dark .btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.stage.has-img.tone-dark .stamp{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-family:var(--body);font-size:19.2px;letter-spacing:0}

/* Quiz */
.progress{position:sticky;top:0;z-index:5;background:var(--surface);padding:12px 20px 10px;border-bottom:1px solid var(--line)}
.progress .row{display:flex;justify-content:space-between;font-size:16.8px;color:var(--muted);margin-bottom:8px}
.progress .row b{color:var(--ink)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.segs i{height:6px;border-radius:3px;background:var(--line);transition:background .2s}
.segs i.done{background:var(--primary)}
.qlist{padding:8px 20px 24px}
.q{padding:24px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.qhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.qnum{flex:none;font-family:var(--display);font-size:40.8px;line-height:1;color:var(--primary);min-width:28px}
.qtext{font-size:21.6px;font-weight:500;line-height:1.5;margin:0}
.qtag{display:inline-block;margin-top:6px;font-size:15.6px;padding:1px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary)}
.qtag.multi{background:color-mix(in srgb,var(--marigold) 22%,transparent);color:color-mix(in srgb,var(--marigold) 55%,var(--ink))}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--muted);display:grid;place-items:center}
.opt.single .mark{border-radius:50%}
.opt.multi .mark{border-radius:6px}
.opt .mark::after{content:"";width:10px;height:10px;background:var(--primary-ink);opacity:0}
.opt.single .mark::after{border-radius:50%}
.opt.multi .mark::after{width:6px;height:11px;background:transparent;border:solid var(--primary-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.opt:has(input:checked) .mark{background:var(--primary);border-color:var(--primary)}
.opt:has(input:checked) .mark::after{opacity:1}
.opt:has(input:focus-visible){outline:3px solid var(--marigold);outline-offset:2px}
.submitbar{position:sticky;bottom:0;z-index:5;background:var(--surface);padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.submitbar .hint{text-align:center;font-size:15.6px;color:var(--muted);margin:0 0 8px}

/* 剝高麗菜葉答題：每答完一題剝掉一片外葉，最後露出高麗菜心 */
.cube-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 12px calc(20px + env(safe-area-inset-bottom,0px));background:var(--bg);overflow:hidden}
.cabbage{--s:min(92vw,440px,calc((100vh - 345px) / 1.53));--s:min(92vw,440px,calc((100svh - 345px) / 1.53));position:relative;width:var(--s);height:calc(var(--s) * 1.42);flex:none;margin:calc(var(--s) * .09) 0 4px;transition:transform .2s cubic-bezier(.5,0,.75,0),opacity .2s ease}
.cabbage.shrink{transform:scale(.18) translateY(-40%);opacity:0}
.leaves{position:absolute;inset:0;perspective:1300px;z-index:1}
.cabbage::before,.cabbage::after{content:"";position:absolute;bottom:1%;width:56%;height:82%;
  background:radial-gradient(110% 90% at 50% 95%, #A6CF52, #5E8F1F 78%);border:4px solid #4F7A18;box-shadow:0 10px 22px rgba(60,40,10,.18);z-index:0;pointer-events:none}
.cabbage::before{left:-3%;border-radius:62% 38% 30% 50% / 58% 42% 30% 42%;transform:rotate(-13deg);transform-origin:100% 100%}
.cabbage::after{right:-3%;border-radius:38% 62% 50% 30% / 42% 58% 42% 30%;transform:rotate(13deg);transform-origin:0% 100%}
.leaf{position:absolute;inset:0;--d:0;transform-origin:50% 100%;
  transform:translateY(calc(var(--d) * -5.2%)) scale(calc(1 - var(--d) * .06));
  transition:transform .45s cubic-bezier(.3,.7,.3,1);
  border-radius:50% 50% 30% 30% / 24% 24% 14% 14%;
  background:radial-gradient(120% 95% at 50% 108%, var(--l1), var(--l2) 72%);
  border:4px solid var(--edge);box-shadow:0 12px 26px rgba(90,30,15,.20), inset 0 -10px 24px rgba(255,255,255,.25)}
.leaf[data-d="0"]{--l1:#D7EE96;--l2:#93C33C;--edge:#6E9E25}
.leaf[data-d="1"]{--l1:#E6F4B6;--l2:#B5D866;--edge:#8DB83A}
.leaf[data-d="2"]{--l1:#F1F8D3;--l2:#CFE58F;--edge:#A9CB5A}
.leaf[data-d="3"]{--l1:#F8FBE6;--l2:#E0EDB5;--edge:#BFD77F}
.leaf.heart{--l1:#FFF9DC;--l2:#F8E79A;--edge:#E2C445}
.leaf[inert]{pointer-events:none}
.leaf .veins{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.leaf .veins path{fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.4;stroke-linecap:round}
.leaf-card{position:absolute;left:4%;right:4%;top:6.5%;bottom:3%;display:flex;flex-direction:column;padding:8px 9px 7px;
  background:rgba(255,253,244,.97);border-radius:20px;box-shadow:inset 0 0 0 2px rgba(110,158,37,.28)}
.leaf:not([data-d="0"]) .leaf-card{visibility:hidden}
.leaf-card{--ink:#3A1A14;--muted:#7A5A50;--surface:#FFFFFF;--line:#E8CFA0;--primary:#AC2A2A;--primary-ink:#FFFFFF;--primary-soft:#FBE3DF;color:#3A1A14}
.leaf-card .qtext{color:#2A110C}
.leaf-card .opt{color:#2A110C;background:#FFFFFF}
.leaf.heart .leaf-card{background:transparent;box-shadow:none;align-items:center;justify-content:center}
.leaf.peel-left,.leaf.peel-right,.leaf.unpeel-left,.leaf.unpeel-right{z-index:30 !important;animation-duration:.6s;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.45,0,.55,1)}
.cabbage.fast .leaf.peel-left,.cabbage.fast .leaf.peel-right{animation-duration:.42s}
.leaf.peel-left{transform-origin:0% 100%;animation-name:peelLeft}
.leaf.peel-right{transform-origin:100% 100%;animation-name:peelRight}
.leaf.unpeel-left{transform-origin:0% 100%;animation-name:peelLeft;animation-direction:reverse}
.leaf.unpeel-right{transform-origin:100% 100%;animation-name:peelRight;animation-direction:reverse}
@keyframes peelLeft{0%{transform:none;opacity:1}35%{transform:translateX(-3%) rotateZ(-5deg) rotateY(26deg);opacity:1}100%{transform:translateX(-58%) translateY(12%) rotateZ(-26deg) rotateY(82deg);opacity:0}}
@keyframes peelRight{0%{transform:none;opacity:1}35%{transform:translateX(3%) rotateZ(5deg) rotateY(-26deg);opacity:1}100%{transform:translateX(58%) translateY(12%) rotateZ(26deg) rotateY(-82deg);opacity:0}}
.panel{display:flex;flex-direction:column;height:100%;min-width:0;margin:0;padding:0;border:0}
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.fnum{font-family:var(--display);font-size:clamp(24px, calc(var(--s) * 0.084), 31.2px);line-height:1;color:var(--primary)}
.fcount{margin-left:auto;font-size:14.4px;color:var(--muted)}
.fbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
.leaf-card .qtext{font-size:clamp(16.8px, calc(var(--s) * 0.0564), 21.6px);font-weight:700;line-height:1.3;margin:0 0 6px}
.leaf-card .qtag{margin-top:0}
.leaf-card .opts{gap:5px}
.leaf-card .fbody{display:flex;flex-direction:column;justify-content:center}
.leaf-card .opt{min-height:clamp(30px, calc(var(--s) * .095), 42px);padding:3px 9px;gap:8px;font-size:clamp(16.2px, calc(var(--s) * 0.0528), 20.4px);line-height:1.26;border-radius:10px}
.leaf-card .opt .mark{width:clamp(18px, calc(var(--s) * .062), 22px);height:clamp(18px, calc(var(--s) * .062), 22px)}
.panel.kv{align-items:center;justify-content:center;gap:10px}
.panel.kv img{width:82%;height:auto;border-radius:18px;box-shadow:0 6px 16px rgba(90,30,15,.18)}
.panel.kv p{margin:0;font-family:var(--display);font-size:28.8px;color:#AC2A2A}
.cube-hint{margin:0;min-height:1.4em;font-size:16.8px;color:var(--muted);text-align:center}
.cube-hint.counting{color:var(--primary);font-weight:700}
.cube-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;width:min(88vw,360px)}
.cube-nav .btn{min-height:50px;font-size:21.6px}
.cube-nav .btn.ghost{font-size:18px}
/* 矮螢幕（例如 iPhone SE）：壓縮 Banner 與間距，讓方塊與按鈕同時顯示 */
@media (max-height: 720px){
  #p-quiz .banner{aspect-ratio:5/1}
  #p-quiz .progress{padding:8px 20px 8px}
  .cube-area{padding-top:8px;gap:8px}
  .cabbage{--s:min(88vw,330px,calc((100vh - 280px) / 1.53));--s:min(88vw,330px,calc((100svh - 280px) / 1.53))}
}
.credits{margin:18px 0 0;font-size:15px;line-height:1.6;color:var(--muted);text-align:center}
/* 結果大圖 */
.result-hero{display:block;width:100%;max-width:420px;height:auto;border-radius:18px;box-shadow:0 10px 26px rgba(46,53,39,.18);margin:0 0 16px}
.result-hero.pop{animation:heroPop .26s cubic-bezier(.2,1.2,.4,1) both}
@keyframes heroPop{from{transform:scale(.25);opacity:0}to{transform:scale(1);opacity:1}}
.resultbox.has-hero .stamp{display:none}
@media (prefers-reduced-motion: reduce){
  .cabbage,.leaf{transition-duration:.01s}
  .leaf.peel-left,.leaf.peel-right,.leaf.unpeel-left,.leaf.unpeel-right{animation-duration:.01s !important}
  .result-hero.pop{animation:none}
}

/* Result */
.resultbox{display:flex;flex-direction:column;align-items:center;text-align:center}
.resultbox h1{margin-bottom:18px}
.stamp{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;position:relative;margin:4px 0 18px;
  border:6px double var(--muted);color:var(--muted);transform:rotate(-8deg);background:color-mix(in srgb,var(--surface) 82%,transparent)}
.stamp.pass{border-color:var(--marigold);color:color-mix(in srgb,var(--marigold) 70%,var(--ink))}
.stamp .pct{font-family:var(--display);font-size:76.8px;line-height:1}
.stamp .pct small{font-size:33.6px}
.stamp .lbl{font-size:16.8px;margin-top:2px}
.stage.has-img .stamp{background:rgba(255,255,255,.92);color:var(--ink)}
.stage.has-img .stamp.pass{color:#AC2A2A}
.rate-line{font-size:21.6px;margin:0 0 6px}
.rate-line b{font-family:var(--display);font-weight:400;font-size:28.8px}
@media (prefers-reduced-motion:no-preference){
  .stamp.animate{animation:press .55s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes press{0%{transform:scale(1.8) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
}
.ticket{width:100%;max-width:320px;margin:18px auto 8px;display:flex;border-radius:14px;overflow:hidden;background:var(--marigold);color:#5A1010;
  -webkit-mask:radial-gradient(circle 10px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 10px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket .l{flex:none;width:74px;display:grid;place-items:center;border-right:2px dashed rgba(42,26,0,.35);font-family:var(--display);font-size:19.2px;line-height:1.3;text-align:center;letter-spacing:.1em}
.ticket .r{flex:1;padding:14px 16px;text-align:left}
.ticket .r span{font-size:15.6px;opacity:.8}
.ticket .r strong{display:block;font-family:var(--display);font-weight:400;font-size:40.8px;letter-spacing:.08em;line-height:1.2}
.ticket-pending,#ticketWrap.pending .ticket{opacity:.75}
#ticketWrap.pending #serial{font-size:28.8px;letter-spacing:.1em;animation:serialBlink 1s ease-in-out infinite alternate}
@keyframes serialBlink{from{opacity:.45}to{opacity:1}}
.note{font-size:16.8px;color:var(--muted);margin:8px 0 0}
.demo-flag{font-size:14.4px;color:var(--muted);margin-top:10px;opacity:.8}

.share{padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.share p{margin:0 0 12px;text-align:center;font-size:16.8px;color:var(--muted)}

.rv{padding:18px 0;border-bottom:1px dashed var(--line)}

.rv-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.rv-badge{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19.2px}
.rv.rv-ok .rv-badge{background:var(--good)}
.rv.rv-ng .rv-badge{background:var(--bad)}
.rv-q{margin:0;font-weight:500;line-height:1.5}
.rv-q small{display:block;font-weight:400;font-size:15.6px;color:var(--muted)}
.rv-opts{display:grid;gap:8px;padding-left:42px}
.rv-opt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:18px}
.rv-opt em{font-style:normal;font-size:14.4px;flex:none;padding:1px 8px;border-radius:6px}
.rv-opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));color:color-mix(in srgb,var(--good) 70%,var(--ink))}
.rv-opt.correct em{background:var(--good);color:#fff}
.rv-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:color-mix(in srgb,var(--bad) 75%,var(--ink))}
.rv-opt.wrong em{background:var(--bad);color:#fff}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:16.8px;max-width:min(420px,90vw);text-align:center;transition:.25s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Admin */

.sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(10,14,24,.5)}

.sheet .panel{position:absolute;left:0;right:0;bottom:0;top:env(safe-area-inset-top,0px);max-width:480px;margin:0 auto;background:var(--surface);

.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:15.6px;color:var(--muted)}
.field input[type=text],.field textarea{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}

.imgpick{display:flex;gap:10px;align-items:center;margin-bottom:12px}

.mini.danger{color:var(--bad)}

.mode-note{font-size:15.6px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin:14px 0 0}

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
function deepMerge(base, over){
  if(!over || typeof over !== "object") return base;
  const out = Array.isArray(base) ? base.slice() : {...base};
  for(const k of Object.keys(over)){
    const v = over[k];
    out[k] = (v && typeof v === "object" && !Array.isArray(v) && base && typeof base[k] === "object" && !Array.isArray(base[k]))
      ? deepMerge(base[k], v) : v;
  }
  return out;
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function cookieGet(k){ try{ const m=document.cookie.match(new RegExp("(?:^|; )"+k+"=([^;]*)")); return m?decodeURIComponent(m[1]):null; }catch(e){ return null; } }
function cookieSet(k,v){ try{ document.cookie=k+"="+encodeURIComponent(v)+"; max-age=31536000; path=/; SameSite=Lax"; }catch(e){} }
function cookieDel(k){ try{ document.cookie=k+"=; max-age=0; path=/"; }catch(e){} }
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : "d"+Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),3200); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pad(n,d){ return String(n).padStart(d,"0"); }

/* 裝置識別：localStorage + cookie 雙重保存的隨機裝置碼 */
function getDeviceId(){
  let id = lsGet("quiz_device_id") || cookieGet("qdid");
  if(!id){ id = uuid(); }
  lsSet("quiz_device_id", id); cookieSet("qdid", id);
  return id;
}
function getLocalRecord(){
  const raw = lsGet("quiz_record") || cookieGet("qrec");
  try{ return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function setLocalRecord(rec){
  lsSet("quiz_record", JSON.stringify(rec));
  const {review, ...slim} = rec; cookieSet("qrec", JSON.stringify(slim)); // cookie 容量有限，不存逐題明細
}
function clearLocalRecord(){ lsDel("quiz_record"); cookieDel("qrec"); }

/* 圖片壓縮：轉 JPEG 並控制大小（存放上限約 240KB） */
function compressImage(file, maxW){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("讀取圖片失敗"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("圖片格式無法辨識"));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        let scale = Math.min(1, maxW / w);
        const c = document.createElement("canvas");
        let q = 0.85, out = "";
        for(let i=0;i<8;i++){
          c.width = Math.round(w*scale); c.height = Math.round(h*scale);
          const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if(out.length < 240000) break;
          if(q > 0.6) q -= 0.1; else scale *= 0.8;
        }
        resolve(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

   - claude ：發布在 claude.ai，使用平台共用資料庫（序號全域依序跳號）
   - api    ：自行架站 + 自有後端（例如 Google Apps Script）
   - local  ：無後端時的本機示範模式（序號只在本機遞增，僅供測試）
   ========================================================= */
/* 可重複遊玩：紀錄保存「最近一次結果」與「此裝置唯一的序號」
   serial 一旦取得就永久保留；再次通過時 repass = true，不再發新序號 */
function nextRecord(prev, rate, passed, review, newSerial, soldOut){
  const serial = (prev && prev.serial != null) ? prev.serial : (newSerial ?? null);
  return {
    rate, passed, review, at: Date.now(),
    serial,
    soldOut: !!(passed && serial == null && soldOut),
    repass: !!(passed && prev && prev.serial != null),
    plays: ((prev && prev.plays) || 0) + 1
  };
}

function localBackend(){
  return {
    mode:"local", canEdit: new URLSearchParams(location.search).get("admin")==="1",
    async getRecord(){ return getLocalRecord(); },
    async getStatus(){ const issued = Number(lsGet("quiz_demo_counter")||0); return {issued, limit: site.serialLimit}; },
    async submit(rate, passed, review){
      const prev = getLocalRecord();
      let newSerial = null, soldOut = false;
      if(passed && !(prev && prev.serial != null)){
        const issued = Number(lsGet("quiz_demo_counter")||0);
        if(issued >= site.serialLimit) soldOut = true;
        else { newSerial = issued + 1; lsSet("quiz_demo_counter", String(newSerial)); }
      }
      const rec = nextRecord(prev, rate, passed, review, newSerial, soldOut);
      setLocalRecord(rec); return rec;
    },
    async resetMine(){ clearLocalRecord(); },
    async loadSite(){
      let cfg = null, imgs = {};
      try{ cfg = JSON.parse(lsGet("quiz_site_cfg")||"null"); }catch(e){}
      try{ imgs = JSON.parse(lsGet("quiz_site_imgs")||"{}"); }catch(e){}
      return {cfg, imgs};
    },
    async saveSite(cfg, imgs){
      lsSet("quiz_site_cfg", JSON.stringify(cfg));
      if(!lsSet("quiz_site_imgs", JSON.stringify(imgs))) throw new Error("圖片太大，瀏覽器儲存空間不足");
    }
  };
}

function claudeBackend(db, user, uid, canEdit){
  const stateRef = db.doc("data/users/"+uid+"/state");
  const siteRef = db.doc("data/site");
  const counterRef = db.doc("data/counter");
  // 回傳新序號；已達上限時回傳 null
  async function claimSerial(limit){
    const holder = uid + "-" + Math.random().toString(36).slice(2,8);
    for(let i=0;i<25;i++){
      const r = await counterRef.acquire({holder, ttlMs:5000});
      if(r.acquired){
        const s = await counterRef.get();
        const issued = (s.exists && Number(s.data().n)) ? Number(s.data().n) : 0;
        if(issued >= limit) return null;
        const n = issued + 1;
        await counterRef.set({n, updatedAt: Date.now()});
        return n;
      }
      await sleep(250 + Math.random()*450);
    }
    throw new Error("序號發放忙碌中");
  }
  return {
    mode:"claude", canEdit,
    async getRecord(){
      const s = await stateRef.get();
      return (s.exists && s.data().record) ? s.data().record : null;
    },
    async getStatus(){
      const s = await counterRef.get();
      return {issued: (s.exists && Number(s.data().n)) || 0, limit: site.serialLimit};
    },
    async submit(rate, passed, review){
      const prev = await this.getRecord();
      let newSerial = null, soldOut = false;
      if(passed && !(prev && prev.serial != null)){
        newSerial = await claimSerial(site.serialLimit);
        soldOut = newSerial == null;
      }
      const rec = nextRecord(prev, rate, passed, review, newSerial, soldOut);
      await stateRef.set({record: rec});
      return rec;
    },
    async resetMine(){ await stateRef.delete(); clearLocalRecord(); },
    async loadSite(){
      const s = await siteRef.get();
      let cfg = null;
      if(s.exists && s.data().config){ try{ cfg = JSON.parse(s.data().config); }catch(e){} }
      const imgs = {};
      await Promise.all(Object.keys(IMG_KEYS).map(async k => {
        const d = await db.doc("data/site/img/"+k).get();
        if(d.exists && d.data().src) imgs[k] = d.data().src;
      }));
      return {cfg, imgs};
    },
    async saveSite(cfg, imgs, changed){
      await siteRef.set({config: JSON.stringify(cfg), updatedAt: Date.now()});
      for(const k of changed){
        const ref = db.doc("data/site/img/"+k);
        if(imgs[k]) await ref.set({src: imgs[k]}); else await ref.delete();
      }
    }
  };
}

function apiBackend(){
  const deviceId = getDeviceId();
  // 呼叫後端：最多等待 20 秒；回應不是 JSON（例如後端錯誤頁）時視為失敗
  async function call(action, extra){
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 20000) : null;
    try{
      const r = await fetch(CONFIG.apiEndpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action, deviceId, ...extra}), signal: ctrl ? ctrl.signal : undefined});
      let j; try{ j = await r.json(); }catch(e){ throw new Error("伺服器回應異常"); }
      if(!j.ok) throw new Error(j.error||"伺服器錯誤"); return j;
    }finally{ if(timer) clearTimeout(timer); }
  }
  const lb = localBackend();
  return {
    mode:"api", canEdit: lb.canEdit, sheetQuestions:false, adminKey:"",
    async loadSite(){
      const j = await call("site");
      if(j.issued != null) this._status = {issued: Number(j.issued), limit: Number(j.limit)};
      let cfg = j.cfg || null;
      if(Array.isArray(j.questions) && j.questions.length){ cfg = {...(cfg||{}), questions: j.questions}; this.sheetQuestions = true; }
      return {cfg, imgs: j.imgs || {}};
    },
    async saveSite(cfg, imgs){
      if(!this.adminKey) throw new Error("請先輸入管理密碼");
      const body = this.sheetQuestions ? {...cfg, questions:null} : cfg;
      try{ await call("saveSite", {adminKey: this.adminKey, cfg: body, imgs}); }
      catch(e){ throw new Error(e.message === "unauthorized" ? "管理密碼錯誤" : e.message); }
    },
    async getStatus(){
      if(this._status) return this._status;
      const j = await call("site"); return {issued: Number(j.issued)||0, limit: Number(j.limit)||site.serialLimit};
    },
    async getRecord(){
      const loc = getLocalRecord();
      if(loc && !loc.error) return loc;
      // 本機是失敗紀錄（或沒有紀錄）時，向後端確認是否其實已發出序號
      try{
        const j = await call("check");
        if(j.record){ const rec = {...j.record, review: loc && loc.review, repass: false}; setLocalRecord(rec); return rec; }
      }catch(e){}
      return loc;
    },
    async submit(rate, passed, review){
      let lastErr;
      for(let i = 0; i < 3; i++){   // 失敗時自動重試 2 次（間隔 1.5 秒、3 秒）
        try{
          const j = await call("submit", {rate});
          const rec = {rate, passed, serial: null, ...(j.record || {}), review, at: Date.now()};
          setLocalRecord(rec); return rec;
        }catch(e){ lastErr = e; if(i < 2) await sleep(1500 * (i + 1)); }
      }
      throw lastErr;
    },
    async resetMine(){ clearLocalRecord(); }
  };
}

async function initBackend(){
  if(CONFIG.apiEndpoint) return apiBackend();
  if(window.claude && typeof window.claude.use === "function"){
    try{
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if(db && user){
        const uid = await user.id();
        const canEdit = await user.canEdit().catch(()=>false);
        if(uid) return claudeBackend(db, user, uid, !!canEdit);
      }
    }catch(e){ console.warn("db 無法使用，改用本機示範模式", e); }
  }
  return localBackend();
}

/* 計算底圖下半部（文字所在區域）的平均亮度，0 = 全黑、1 = 全白 */
const lumaCache = {};
function imageLuma(src){
  if(lumaCache[src]) return lumaCache[src];
  return lumaCache[src] = new Promise(res => {
    const i = new Image();
    i.onload = () => {
      try{
        const c = document.createElement("canvas"); c.width = 40; c.height = 40;
        const x = c.getContext("2d"); x.drawImage(i, 0, 0, 40, 40);
        const d = x.getImageData(0, 16, 40, 24).data; let t = 0;
        for(let k = 0; k < d.length; k += 4) t += 0.2126*d[k] + 0.7152*d[k+1] + 0.0722*d[k+2];
        res(t / (d.length/4) / 255);
      }catch(e){ res(0); }
    };
    i.onerror = () => res(0);
    i.src = src;
  });
}
function applyTone(el, src, tone){

/* ---- 答題 ---- */
/* 剝高麗菜葉：每答完一題剝掉一片外葉（左右交錯），最後露出高麗菜心（活動角色）。
   正在作答的永遠是最上層的葉片；下層葉片只露出邊緣，營造層層包覆的高麗菜。 */
const FLIP_DIR = ["", "left", "right", "left", "right", "left"]; // 剝到第 i 片時，上一片葉子往哪一側剝開
const REVERSE = { left: "left", right: "right" };               // 返回上一題：葉片從原本剝開的一側蓋回來
const VEINS = '<svg class="veins" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 99 C49 70 50 35 50 4"/><path d="M50 72 C38 64 24 60 10 58"/><path d="M50 72 C62 64 76 60 90 58"/><path d="M50 50 C40 40 28 34 14 32"/><path d="M50 50 C60 40 72 34 86 32"/><path d="M50 28 C44 20 36 15 26 12"/><path d="M50 28 C56 20 64 15 74 12"/></svg>';
let faceIdx = 0, flipping = false, panels = [];
function leafFor(i){
  const stack = $("#cube");
  let el = stack.querySelector(`.leaf[data-i="${i}"]:not(.peeling)`);
  if(!el){
    el = document.createElement("div"); el.className = "leaf" + (i === 5 ? " heart" : ""); el.dataset.i = i;
    const card = document.createElement("div"); card.className = "leaf-card";
    el.innerHTML = VEINS; el.appendChild(card);
  }
  const card = el.querySelector(".leaf-card");
  if(panels[i] && panels[i].parentNode !== card){ card.innerHTML = ""; card.appendChild(panels[i]); }
  return el;
}
/* 依目前題號排列葉片：最上層為目前題目，下面最多再露出 3 層 */
function renderStack(){
  const stack = $("#cube"), keep = new Set();
  for(let i = faceIdx; i <= 5 && i <= faceIdx + 3; i++){
    const el = leafFor(i), d = i - faceIdx;
    el.dataset.d = d; el.style.setProperty("--d", d); el.style.zIndex = 10 - d; el.inert = d !== 0;
    keep.add(el); if(el.parentNode !== stack) stack.appendChild(el);
  }
  [...stack.children].forEach(el => { if(!keep.has(el) && !el.classList.contains("peeling")) el.remove(); });
}
function flipTo(i, dir){
  if(flipping || i === faceIdx) return Promise.resolve();
  flipping = true; updateProgress(true);
  const stack = $("#cube"), scene = $("#cubeScene");
  const fast = scene.classList.contains("fast") || stack.classList.contains("fast");
  const dur = fast ? 420 : 600;
  return new Promise(resolve => {
    if(i > faceIdx){
      // 往下一題：剝掉最上層的葉片
      const top = stack.querySelector(`.leaf[data-i="${faceIdx}"]`);
      top.classList.add("peeling", "peel-" + dir); top.inert = true;
      faceIdx = i; renderStack();
      setTimeout(() => { top.remove(); flipping = false; updateProgress(); resolve(); }, dur + 30);
    }else{
      // 返回上一題：葉片從側邊蓋回來
      faceIdx = i; renderStack();
      const top = stack.querySelector(`.leaf[data-i="${i}"]`);
      top.classList.add("unpeel-" + dir);
      setTimeout(() => { top.classList.remove("unpeel-" + dir); flipping = false; updateProgress(); resolve(); }, dur + 30);
    }
  });
}
function buildQuiz(){
  clearAuto();
  const picked = shuffle(bank()).slice(0, Math.min(site.questionCount, 5));
  current = picked.map(q => {
    const order = shuffle(q.options.map((_,i)=>i));
    return {q, order};
  });
  panels = current.map((item, qi) => {
    const multi = item.q.type === "multi";
    const panel = document.createElement("fieldset"); panel.className = "panel";
    const head = document.createElement("div"); head.className = "fhead";
    const num = document.createElement("span"); num.className = "fnum"; num.textContent = "Q" + (qi+1);
    const tag = document.createElement("span"); tag.className = "qtag" + (multi?" multi":""); tag.textContent = multi ? "複選" : "單選";
    const cnt = document.createElement("span"); cnt.className = "fcount"; cnt.textContent = `${qi+1} / ${current.length}`;
    head.append(num, tag, cnt);
    const body = document.createElement("div"); body.className = "fbody";
    const lg = document.createElement("legend"); lg.className = "qtext"; lg.textContent = item.q.q;
    const opts = document.createElement("div"); opts.className = "opts";
    item.order.forEach(oi => {
      const lab = document.createElement("label"); lab.className = "opt " + (multi?"multi":"single");
      const inp = document.createElement("input");
      inp.type = multi ? "checkbox" : "radio"; inp.name = "q"+qi; inp.value = oi;
      inp.addEventListener("change", () => {
        const last = qi === current.length - 1;
        if(multi){
          // 複選題：勾選後停留 2 秒自動翻到下一題；最後一題 2 秒後自動送出；每次變更勾選都重新計時
          if(answersOf(qi).length) scheduleAuto(qi, last ? AUTO_LAST_MS : AUTO_MULTI_MS); else clearAuto();
          if(last) prewarmResultHero();
        }else if(last){
          prewarmResultHero();
          // 最後一題為單選：選完停留 2 秒後自動送出；改選會重新計時
          scheduleAuto(qi, AUTO_LAST_MS);
        }else{
          // 單選題：選好後自動翻到下一題
          clearAuto();
          setTimeout(() => { if(faceIdx === qi && !flipping && answersOf(qi).length) flipTo(qi + 1, FLIP_DIR[qi + 1]); }, 400);
        }
        updateProgress();
      });
      const mk = document.createElement("span"); mk.className = "mark"; mk.setAttribute("aria-hidden","true");
      const t = document.createElement("span"); t.textContent = item.q.options[oi];
      lab.append(inp, mk, t); opts.appendChild(lab);
    });
    body.append(lg, opts); panel.append(head, body);
    return panel;
  });
  // 高麗菜心：活動角色
  const kv = document.createElement("div"); kv.className = "panel kv";
  const kvImg = document.createElement("img"); kvImg.src = ART.MASCOT; kvImg.alt = "嘉禾益高麗菜角色";
  const kvTxt = document.createElement("p"); kvTxt.textContent = "闖關完成！";
  kv.append(kvImg, kvTxt); panels[5] = kv;
  // 疊好整顆高麗菜
  $("#cube").innerHTML = ""; $("#cubeScene").classList.remove("fast");
  faceIdx = 0; flipping = false; renderStack();
  $("#cubeScene").classList.remove("shrink");
  $("#totalCount").textContent = current.length;
  const segs = $("#segs"); segs.innerHTML = ""; segs.style.gridTemplateColumns = `repeat(${current.length},1fr)`;
  for(let i=0;i<current.length;i++) segs.appendChild(document.createElement("i"));
  updateProgress();
}
function answersOf(qi){ return panels[qi] ? [...panels[qi].querySelectorAll("input:checked")].map(i => Number(i.value)) : []; }
/* 自動翻頁／送出計時：複選題 2 秒；最後一題（單選或複選）2 秒後自動送出；倒數顯示在方塊下方 */
const AUTO_MULTI_MS = 2000, AUTO_LAST_MS = 2000;
let autoTimer = null, autoTick = null, autoQi = -1, autoDeadline = 0;
function clearAuto(){ clearTimeout(autoTimer); clearInterval(autoTick); autoTimer = autoTick = null; autoQi = -1; }
function scheduleAuto(qi, ms){
  clearAuto();
  autoQi = qi; autoDeadline = Date.now() + ms;
  autoTick = setInterval(() => updateProgress(), 250);
  autoTimer = setTimeout(() => {
    clearAuto();
    if(faceIdx !== qi || flipping || !answersOf(qi).length) { updateProgress(); return; }
    const last = qi === current.length - 1;
    if(last && current.some((_, k) => !answersOf(k).length)){ updateProgress(); return; } // 仍有未作答題目時不送出
    nextFace();
  }, ms);
}
function updateProgress(busy){
  let done = 0; const segs = $("#segs").children;
  current.forEach((_,qi) => { const a = answersOf(qi).length>0; if(a) done++; segs[qi] && segs[qi].classList.toggle("done", a); });
  $("#doneCount").textContent = done;
  const btn = $("#submitBtn"), prev = $("#prevBtn"), hint = $("#submitHint");
  if(busy || flipping || faceIdx >= current.length){ btn.disabled = true; prev.disabled = true; return; }
  const last = faceIdx === current.length - 1, answered = answersOf(faceIdx).length > 0;
  const multi = current[faceIdx] && current[faceIdx].q.type === "multi";
  btn.textContent = last ? "送出答案" : "下一題";
  btn.disabled = !answered || (last && done < current.length);
  prev.disabled = faceIdx === 0;
  const counting = autoTimer && autoQi === faceIdx;
  const secs = counting ? Math.max(1, Math.ceil((autoDeadline - Date.now()) / 1000)) : 0;
  if(last && done < current.length) hint.textContent = `還有 ${current.length - done} 題未作答，可按「上一題」返回`;
  else if(counting) hint.textContent = last ? `${secs} 秒後自動送出` : `${secs} 秒後自動剝開下一片葉子（可繼續勾選）`;
  else if(multi) hint.textContent = last ? "複選題：勾選後 2 秒自動送出，也可直接按「送出答案」" : "複選題：勾選後 2 秒自動剝開下一片葉子，也可直接按「下一題」";
  else hint.textContent = last ? "選擇答案後 2 秒自動送出" : "選擇答案後會自動剝開下一片葉子";
  hint.classList.toggle("counting", !!counting);
}
function nextFace(){
  if(flipping) return;
  clearAuto();
  if(faceIdx < current.length - 1){ if(answersOf(faceIdx).length) flipTo(faceIdx + 1, FLIP_DIR[faceIdx + 1]); }
  else submitQuiz();
}
function prevFace(){
  if(flipping || faceIdx <= 0 || faceIdx >= current.length) return;
  clearAuto();
  flipTo(faceIdx - 1, REVERSE[FLIP_DIR[faceIdx]]);
}
/* 送出後：剝開最後一片葉子露出高麗菜心 → 縮小淡出 → 結果大圖彈出 */
async function cubeToResult(heroReady){
  // 送出到結果頁完成約 0.93 秒：剝開最後一片葉子 0.42 秒＋停留 0.05 秒＋縮小 0.2 秒＋大圖彈出 0.26 秒
  await Promise.all([sleep(470), Promise.race([heroReady, sleep(470)])]); // 大圖若尚未產生完成，不再等待（稍後自動補上）
  $("#cubeScene").classList.add("shrink");
  await sleep(200);
  $("#cubeScene").classList.remove("fast");
  show("p-result");
  const hero = $("#resultHero");
  if(!hero.hidden){ hero.classList.remove("pop"); void hero.offsetWidth; hero.classList.add("pop"); }
}
/* 依目前作答計算結果（手機端即時計算，不需等待後端） */
function computeOutcome(){
  let correct = 0;
  const review = current.map((item, qi) => {
    const chosenOrig = answersOf(qi);
    const ok = chosenOrig.slice().sort().join(",") === item.q.answer.slice().sort().join(",");
    if(ok) correct++;
    // 以玩家看到的選項順序保存
    return {
      q: item.q.q, type: item.q.type, ok,
      opts: item.order.map(oi => item.q.options[oi]),
      correct: item.order.map((oi, di) => item.q.answer.includes(oi) ? di : -1).filter(i => i >= 0),
      chosen: item.order.map((oi, di) => chosenOrig.includes(oi) ? di : -1).filter(i => i >= 0)
    };
  });
  const rate = Math.round(correct / current.length * 100);
  return { rate, passed: rate >= site.passThreshold, review };
}
/* 全部作答完成時（最後一題倒數期間）先產生結果大圖，送出時可直接使用 */
function prewarmResultHero(){
  if(!current.length || current.some((_, i) => !answersOf(i).length)) return;
  const o = computeOutcome();
  heroPromise = renderResultHero({ rate: o.rate, passed: o.passed });
}
async function submitQuiz(){
  const btn = $("#submitBtn"); btn.disabled = true; $("#prevBtn").disabled = true; btn.textContent = "送出中…";
  $("#cubeScene").classList.add("fast");
  flipTo(5, FLIP_DIR[5]); // 剝開最後一片葉子，露出高麗菜心
  const { rate, passed, review } = computeOutcome();
  if(NO_SERIAL){
    // 體驗版：只在畫面上顯示結果，不送後端、不保存紀錄
    record = {rate, passed, review, serial:null, shareMode:true, at:Date.now()};
    renderResult(record, true); updateStartBtn();
    await cubeToResult(heroPromise);
    return;
  }
  // 先以手機端計算的結果顯示結果頁；序號由後端回傳後再補上
  const prev = record || getLocalRecord();
  const provisional = nextRecord(prev, rate, passed, review, null);
  const needSerial = passed && provisional.serial == null;
  if(needSerial) provisional.pending = true;
  record = provisional;
  renderResult(record, true);
  const transition = cubeToResult(heroPromise);
  let final;
  try{
    try{ await backendReady; }catch(e){}
    if(!backend) backend = localBackend();
    final = await backend.submit(rate, passed, review);
    // 本輪原本沒有序號：若重試時後端回傳「已有序號」，代表是同一次發放（回應曾遺失），不是再次通關
    if(needSerial) final = {...final, repass: false};
  }catch(e){
    console.error(e);
    final = {...nextRecord(prev, rate, passed, review, null), error:true};
    toast("連線失敗，結果未能送出至伺服器，請稍後再嘗試。");
  }
  await transition;
  record = final;
  setLocalRecord(record);
  if(record.soldOut) serialStatus = {issued: site.serialLimit, limit: site.serialLimit};
  else if(record.serial != null && serialStatus && !record.repass) serialStatus.issued = Math.max(serialStatus.issued, record.serial);
  applySite();
  renderResult(record, false);
  updateStartBtn();
}

/* ---- 結果 ---- */
function renderResult(rec, animate, serialView){
  $("#pct").textContent = rec.rate; if($("#pct2")) $("#pct2").textContent = rec.rate;
  const repass = !!(rec.passed && rec.repass && !rec.shareMode);
  const resTitleText = rec.passed ? (repass ? site.result.repassTitle : site.result.passTitle) : site.result.failTitle;
  $("#resTitle").textContent = resTitleText || ""; $("#resTitle").hidden = !resTitleText; // 標題文字為空時隱藏整個標題
  const stamp = $("#stamp"); stamp.classList.toggle("pass", !!rec.passed);
  stamp.classList.remove("animate"); if(animate){ void stamp.offsetWidth; stamp.classList.add("animate"); }
  // 序號券：本次通過時顯示；從首頁「查看我的兌換序號」進入時也顯示
  const owns = rec.serial != null;
  const pending = !!(rec.pending && rec.passed && !owns && !rec.shareMode);
  const showTicket = (owns && (rec.passed || serialView)) || pending;
  $("#ticketWrap").hidden = !showTicket;
  $("#ticketWrap").classList.toggle("pending", pending);
  if(owns) $("#serial").textContent = pad(rec.serial, site.serialDigits);
  else if(pending) $("#serial").textContent = "發放中";
  let note;
  if(pending) note = "兌換序號發放中，請稍候…";
  else if(rec.shareMode) note = rec.passed ? site.result.shareNote : site.result.failNote;
  else if(rec.passed) note = owns ? (repass ? site.result.repassNote : site.result.passNote)
    : (rec.soldOut ? site.result.soldOutNote : "序號暫時無法取得，請按下方「重新取得序號」再試一次。");
  else note = site.result.failNote + (owns ? `（您先前取得的兌換序號 No. ${pad(rec.serial, site.serialDigits)} 仍然有效）` : "");
  $("#resNote").textContent = note;
  $("#retrySerialBtn").hidden = !(rec.error && rec.passed && !owns && !rec.shareMode && !rec.soldOut);
  const flag = $("#demoFlag");
  flag.hidden = !(backend && backend.mode === "local") || !!rec.shareMode;
  flag.textContent = "目前為本機示範模式，序號僅在此裝置遞增，正式上線需接後端。";
  updateShareLinks();
  renderReview(rec.review);
  heroPromise = renderResultHero(rec);
}
/* 結果頁大圖：與分享圖同款（不含「你也來試試看」），只呈現正確率、不含序號。
   以 data URL 寫入圖片（不使用暫存 blob 網址），提高 iOS Safari 與 App 內建瀏覽器的相容性；
   若仍載入失敗，改顯示正確率印章。 */
let heroPromise = Promise.resolve(), heroKey = "";
function blobToDataURL(blob){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
}
function renderResultHero(rec){
  const key = [rec.rate, rec.passed, site.share.imageTitle, site.gameTitle].join("|");
  const img = $("#resultHero"), box = img.closest(".resultbox");
  const fallback = () => { img.hidden = true; img.removeAttribute("src"); box.classList.remove("has-hero"); };
  if(key === heroKey && img.getAttribute("src") && !img.hidden) return Promise.resolve();
  heroKey = key;
  const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
  // 新的成績：先隱藏舊圖（改顯示正確率印章），避免短暫或持續顯示上一輪的圖
  fallback();
  return withTimeout(makeShareImage({ forPage: true, rec: { rate: rec.rate, passed: rec.passed } }).then(blobToDataURL), 6000).then(url => {
    if(heroKey !== key) return;
    return new Promise(res => {
      img.onload = () => { img.hidden = false; box.classList.add("has-hero"); res(); };
      img.onerror = () => { fallback(); res(); };
      img.alt = `答題正確率 ${rec.rate}%`;
      img.src = url;
    });
  }).catch(() => { if(heroKey === key) fallback(); });
}
/* 預先產生分享圖，讓點擊分享時能立即開啟分享選單（部分手機瀏覽器要求在點擊後短時間內呼叫） */
let shareImageCache = { key: "", blob: null };
function shareImageKey(){ return record ? [record.rate, record.passed, site.share.imageTitle, site.gameTitle].join("|") : ""; }
function prepareShareImage(){
  const key = shareImageKey(); if(!key || shareImageCache.key === key) return;
  shareImageCache = { key, blob: null };
  setTimeout(() => { makeShareImage().then(b => { if(shareImageCache.key === key) shareImageCache.blob = b; }).catch(() => {}); }, 300);
}
async function getShareImageFile(){
  const key = shareImageKey();
  const blob = (shareImageCache.key === key && shareImageCache.blob) ? shareImageCache.blob : await makeShareImage();
  return new File([blob], "quiz-result.jpg", { type: "image/jpeg" });
}
function renderReview(list){
  const box = $("#review"), wrap = $("#reviewList");

  list.forEach((r, i) => {
    const el = document.createElement("div"); el.className = "rv " + (r.ok ? "rv-ok" : "rv-ng");
    const head = document.createElement("div"); head.className = "rv-head";
    const badge = document.createElement("span"); badge.className = "rv-badge"; badge.textContent = r.ok ? "✓" : "✗";
    badge.setAttribute("aria-label", r.ok ? "答對" : "答錯");

    const meta = document.createElement("small"); meta.textContent = (r.type === "multi" ? "複選" : "單選") + "｜" + (r.ok ? "答對" : "答錯");
    q.appendChild(meta); head.append(badge, q);
    const opts = document.createElement("div"); opts.className = "rv-opts";
    r.opts.forEach((t, di) => {

function shareUrl(){
  const base = site.share.url || location.href.split("#")[0].split("?")[0];
  if(!site.share.toNoSerial || CONFIG.noSerial) return base;
  try{ const u = new URL(base); u.searchParams.set("mode", "share"); return u.toString(); }
  catch(e){ return base + (base.includes("?") ? "&" : "?") + "mode=share"; }
}
function shareText(){ return site.share.text.replace("{title}", site.gameTitle).replace("{rate}", record ? record.rate : 0); }
/* 臉書／LINE 只能讀取網頁中寫好的預覽圖，無法使用玩家手機產生的圖片。
   5 題的正確率只有 0、20、40、60、80、100 六種，因此預先做好 6 個結果預覽頁（r 資料夾），
   分享時依正確率帶入對應網址；點開後會自動轉到遊戲（體驗版）。 */
function resultShareUrl(){
  const rate = record ? record.rate : null;
  const shortUrl = rate != null && site.share.shortUrls && String(site.share.shortUrls[String(rate)] || "").trim();
  if(shortUrl && /^https?:\/\//i.test(shortUrl)) return shortUrl;
  if(!site.share.resultPages || rate == null || ![0,20,40,60,80,100].includes(rate)) return shareUrl();
  let base = site.share.url || location.href.split("#")[0].split("?")[0];
  try{
    const u = new URL(base);
    u.search = ""; u.hash = "";
    if(!u.pathname.endsWith("/") && !/\.[a-z0-9]+$/i.test(u.pathname)) u.pathname += "/";
    const r = new URL("r/" + rate + ".html", u);
    if(site.share.previewVersion) r.searchParams.set("v", String(site.share.previewVersion));
    return r.toString();
  }catch(e){ return shareUrl(); }
}
/* LINE 用的網址：預設使用短網址；若 LINE 對短網址不產生縮圖，可在編輯模式關閉「LINE 使用短網址」改用原網址 */
function lineShareUrl(){
  if(site.share.lineUseShortUrl === false){
    const keep = site.share.shortUrls; site.share.shortUrls = {};
    try{ return resultShareUrl(); } finally { site.share.shortUrls = keep; }
  }
  return resultShareUrl();
}
function updateShareLinks(){
  const u = encodeURIComponent(resultShareUrl()), t = encodeURIComponent(shareText());
  // LINE：手機改用 LINE 官方分享網址，可帶入「說明文字＋連結」並直接開啟 LINE；電腦版維持網頁分享
  $("#shareLine").href = isMobileDevice()
    ? `https://line.me/R/share?text=${encodeURIComponent(shareText().trim() + "\n" + lineShareUrl())}`
    : `https://social-plugins.line.me/lineit/share?url=${u}&text=${t}`;
  $("#shareFB").href = `https://www.facebook.com/sharer/sharer.php?u=${u}`;
  // Threads：官方發文網址，帶入「分享文字＋縮網址」  
  $("#shareThreads").href = `https://www.threads.net/intent/post?text=${encodeURIComponent(shareText().trim() + "\n" + resultShareUrl())}`;
}

/* 分享圖：只呈現正確率，不含序號 */
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function makeShareImage(opts){
  const forPage = !!(opts && opts.forPage);
  const R = (opts && opts.rec) || record; // 要繪製的成績：結果頁大圖傳入當輪成績，避免讀到上一輪的紀錄
  try{ await Promise.race([document.fonts.ready, sleep(1500)]); }catch(e){}
  const W=1080, H=1350, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const G="#AC2A2A", O="#F2C200", BEIGE="#FFF2CF"; // 嘉禾益品牌紅、黃金泡菜黃、奶油米色
  const disp = '"Huninn","PingFang TC","Noto Sans TC",sans-serif';
  x.fillStyle=BEIGE; x.fillRect(0,0,W,H);
  // 主視覺 Logo 組合圖
  let artBottom = 120;
  try{
    const art = await loadImg(ART.SHARE_LOGO);
    const aw = 860, ah = Math.round(aw * art.height / art.width);
    x.drawImage(art, (W-aw)/2, 30, aw, ah); artBottom = 30 + ah;
  }catch(e){}
  // 放射線背景（呼應主視覺），只畫在插圖下方，避免與插圖底色重疊成方框
  x.save(); x.beginPath(); x.rect(0, artBottom, W, H - artBottom); x.clip();
  x.translate(W/2, 1150); x.fillStyle="rgba(172,42,42,.07)";
  for(let i=0;i<36;i++){ x.rotate(Math.PI*2/36); x.beginPath(); x.moveTo(0,0); x.lineTo(-40,-900); x.lineTo(40,-900); x.closePath(); x.fill(); }
  x.restore();
  x.textAlign="center"; x.lineJoin="round";
  // 主標（取最後一行）
  const lines = String(site.share.imageTitle || "").split(/\n/).map(t => t.trim()).filter(Boolean);
  const title = lines.length ? lines[lines.length-1] : "";
  if(title){
    let ts = 76; x.font=`${ts}px ${disp}`;
    const tw = x.measureText(title).width; if(tw > 940){ ts = Math.floor(ts*940/tw); x.font=`${ts}px ${disp}`; }
    const ty = artBottom + 30 + ts;
    x.lineWidth=14; x.strokeStyle="#fff"; x.strokeText(title, W/2, ty);
    x.fillStyle=G; x.fillText(title, W/2, ty);
    artBottom = ty;
  }
  // 正確率印章（左）＋產品上蓋圖樣（右）
  const cy = artBottom + 280, sx = 300, lx = 790, lr = 215;
  x.save(); x.translate(sx, cy); x.rotate(-8*Math.PI/180);
  x.fillStyle="#fff"; x.beginPath(); x.arc(0,0,200,0,Math.PI*2); x.fill();
  const ring = R.passed ? O : "#D9B8B0";
  x.strokeStyle=ring; x.lineWidth=14; x.beginPath(); x.arc(0,0,176,0,Math.PI*2); x.stroke();
  x.lineWidth=5; x.beginPath(); x.arc(0,0,156,0,Math.PI*2); x.stroke();
  x.fillStyle=G; let rs=130; x.font=`${rs}px ${disp}`;
  const rw = x.measureText(R.rate+"%").width; if(rw > 280){ rs = Math.floor(rs*280/rw); x.font=`${rs}px ${disp}`; }
  x.fillText(R.rate+"%", 0, 40);
  x.fillStyle="#3A3A2E"; x.font=`38px ${disp}`; x.fillText("答題正確率", 0, 100);
  x.restore();
  try{
    const lid = await loadImg(ART.LID);
    x.save(); x.shadowColor="rgba(90,30,15,.25)"; x.shadowBlur=26; x.shadowOffsetY=10;
    x.fillStyle="#fff"; x.beginPath(); x.arc(lx, cy, lr, 0, Math.PI*2); x.fill(); x.restore();
    x.save(); x.beginPath(); x.arc(lx, cy, lr, 0, Math.PI*2); x.clip(); x.drawImage(lid, lx-lr, cy-lr, lr*2, lr*2); x.restore();
  }catch(e){}
  // 結果文字（置中）
  const ty = cy + 330;
  x.fillStyle=G; x.font=`80px ${disp}`;
  x.fillText(R.passed ? "挑戰成功！" : "完成挑戰！", W/2, ty);
  if(forPage){
    // 結果頁大圖：依內容高度裁切，不留下方空白
    const Hf = ty + 70, c2 = document.createElement("canvas"); c2.width = W; c2.height = Hf;
    c2.getContext("2d").drawImage(c, 0, 0);
    return new Promise(r => c2.toBlob(r, "image/jpeg", 0.9));
  }
  // 分享圖：「你也來試試看」膠囊
  x.font=`46px ${disp}`; const pt="你也來試試看！", pw = x.measureText(pt).width + 72, ph = 80;
  const px = W/2 - pw/2, py = ty + 50;
  x.fillStyle=O; x.beginPath();
  if(x.roundRect) x.roundRect(px, py, pw, ph, 40); else x.rect(px, py, pw, ph);
  x.fill(); x.fillStyle=G; x.fillText(pt, W/2, py + 56);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
}
async function shareIG(){
  if(!record) return;
  const blob = await makeShareImage();
  const file = new File([blob], "quiz-result.jpg", {type:"image/jpeg"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text: shareText() + shareUrl()});
      return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  // 無法直接分享時：下載結果圖
  let saved = false;
  if(window.claude && typeof window.claude.use === "function"){
    try{ const dl = await claude.use("downloads"); if(dl){ await dl.save({filename:"quiz-result.jpg", data: blob}); saved = true; } }
    catch(e){ if(e && e.code === "declined") return; }
  }
  if(!saved){
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "quiz-result.jpg";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }
  try{ await navigator.clipboard.writeText(shareText() + shareUrl()); }catch(e){}
  toast("結果圖已儲存，分享文字已複製。請開啟 Instagram 上傳至限時動態或貼文。");
}

        <span style="font-size:14px">分享連結導向「體驗版」（不發序號，網址會自動加上 ?mode=share）</span></label>
      <label class="field" style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" id="resultPages" ${draft.share.resultPages ? "checked" : ""} style="width:20px;height:20px">
        <span style="font-size:14px">臉書／LINE 分享顯示玩家的正確率結果圖（需已上傳 r 資料夾）</span></label>
      <div class="field"><label>各正確率的短網址（選填；未填則使用原本網址）</label>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center">
        ${["0","20","40","60","80","100"].map(r => `<span style="font-size:13px;color:var(--muted)">${r}%</span><input type="text" inputmode="url" data-short="${r}" placeholder="https://…" value="${escapeAttr((draft.share.shortUrls||{})[r]||"")}" style="font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">`).join("")}
        </div>
        <small style="color:var(--muted)">短網址需轉向「…/r/正確率.html?v=${escapeAttr(draft.share.previewVersion||"")}」，填入後請先用臉書分享偵錯工具測試預覽。</small></div>
      <label class="field" style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" id="lineUseShortUrl" ${draft.share.lineUseShortUrl !== false ? "checked" : ""} style="width:20px;height:20px">
        <span style="font-size:14px">LINE 分享使用短網址（若 LINE 不顯示縮圖，可取消勾選改用原網址）</span></label>
      ${field("結果預覽版本號（更換結果圖後改成新數字，可避開臉書／LINE 舊快取）","share.previewVersion")}
      ${field("分享文字（{title} = 遊戲名稱、{rate} = 正確率）","share.text", true)}
      ${field("分享圖主標（顯示於活動主視覺圖下方）","share.imageTitle")}
    </fieldset>
    <fieldset class="fs"><legend>兌換序號</legend>
      <p style="font-size:13px;color:var(--muted);margin:0 0 10px">目前已發出 ${serialStatus ? serialStatus.issued : "—"} 組${serialStatus && serialStatus.issued >= draft.serialLimit ? "（已達上限）" : ""}</p>
      ${numField("發放上限（組）","serialLimit",1)}${numField("顯示位數（例：3 → 001）","serialDigits",1)}
      ${field("首頁提示文字（序號發完後取代副標題）","home.soldOutNotice", true)}
      ${field("結果頁通過說明（序號發完後）","result.soldOutNote", true)}
      ${field("體驗版首頁提示文字","home.shareSubtitle", true)}
      ${field("體驗版結果頁通過說明","result.shareNote", true)}
    </fieldset>
    <fieldset class="fs"><legend>頁首 Banner（建議 1200 × 400 像素）</legend>
      ${imgPicker("banner_home")}${field("首頁 Banner 文字（未上傳圖片時顯示）","banners.home")}
      ${imgPicker("banner_quiz")}${field("答題頁 Banner 文字","banners.quiz")}
      ${imgPicker("banner_result")}${field("結果頁 Banner 文字","banners.result")}
    </fieldset>
    <fieldset class="fs"><legend>首頁底圖與疊字（底圖建議 1080 × 1350 像素）</legend>
      ${imgPicker("bg_home")}${toneField("底圖上的文字顏色","home.textTone")}
      ${field("主標題","home.title")}${field("副標題","home.subtitle", true)}${field("按鈕文字","home.button")}
    </fieldset>
    <fieldset class="fs"><legend>結果頁底圖與疊字</legend>
      ${imgPicker("bg_result")}${toneField("底圖上的文字顏色","result.textTone")}
      ${field("首次通過標題","result.passTitle")}${field("首次通過說明","result.passNote", true)}
      ${field("再次通過標題","result.repassTitle")}${field("再次通過說明","result.repassNote", true)}
      ${field("未通過標題","result.failTitle")}${field("未通過說明","result.failNote", true)}
    </fieldset>
    <fieldset class="fs"><legend>題庫（目前 ${qs.length} 題${backend.sheetQuestions?"，來自試算表":Array.isArray(draft.questions)?"，自訂":"，內建範例"}）</legend>
      ${qEditor}
    </fieldset>
    <fieldset class="fs" style="border-bottom:0"><legend>測試工具</legend>
      <p style="font-size:13px;color:var(--muted);margin:0 0 8px">清除「你自己」在此裝置與帳號上的作答紀錄，方便重複測試。不影響其他玩家，也不會重設序號。</p>
      <button class="mini danger" type="button" id="resetMine">清除我的作答紀錄</button>
    </fieldset>`;
  $("#adminBody").querySelectorAll("[data-path]").forEach(inp => inp.addEventListener("input", () => {
    const [a,b] = inp.dataset.path.split("."); if(b) draft[a][b] = inp.value; else draft[a] = inp.value;
  }));
  const tns = $("#toNoSerial"); if(tns) tns.addEventListener("change", () => { draft.share.toNoSerial = tns.checked; });
  $("#adminBody").querySelectorAll("[data-short]").forEach(inp => inp.addEventListener("input", () => {
    draft.share.shortUrls = {...(draft.share.shortUrls || {}), [inp.dataset.short]: inp.value.trim()};
  }));
  const lus = $("#lineUseShortUrl"); if(lus) lus.addEventListener("change", () => { draft.share.lineUseShortUrl = lus.checked; });
  const rps = $("#resultPages"); if(rps) rps.addEventListener("change", () => { draft.share.resultPages = rps.checked; });
  $("#adminBody").querySelectorAll("[data-num]").forEach(inp => inp.addEventListener("input", () => {
    const n = parseInt(inp.value, 10);
    if(Number.isInteger(n) && n >= Number(inp.dataset.min)) draft[inp.dataset.num] = n;
  }));
  $("#adminBody").querySelectorAll("[data-img]").forEach(inp => inp.addEventListener("change", async () => {
    const f = inp.files[0]; if(!f) return;
    const key = inp.dataset.img;
    try{ draftImgs[key] = await compressImage(f, key.startsWith("banner") ? 1200 : 1080); changedImgs.add(key); renderAdmin(); }
    catch(e){ toast(e.message); }
  }));
  $("#adminBody").querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { delete draftImgs[b.dataset.rm]; changedImgs.add(b.dataset.rm); renderAdmin(); }));
  const ki = $("#adminKeyInp");
  if(ki) ki.addEventListener("input", () => { backend.adminKey = ki.value; try{ sessionStorage.setItem("quiz_admin_key", ki.value); }catch(e){} });
  if(backend.sheetQuestions) return;
  $("#qExport").onclick = () => { $("#qjson").value = JSON.stringify(qs, null, 1); };
  $("#qReset").onclick = () => { draft.questions = null; renderAdmin(); qmsg("已改回內建範例題庫，按「儲存變更」生效。", true); };
  $("#qApply").onclick = () => {
    try{
      const arr = JSON.parse($("#qjson").value);
      const err = validateQuestions(arr); if(err) return qmsg(err, false);
      draft.questions = arr; renderAdmin(); qmsg(`已套用 ${arr.length} 題，按「儲存變更」生效。`, true);
    }catch(e){ qmsg("JSON 格式錯誤：" + e.message, false); }
  };
  $("#resetMine").onclick = async () => {
    await backend.resetMine(); record = null; updateStartBtn(); show("p-home"); closeAdmin();
    toast(backend.mode === "api" ? "已清除本機紀錄；後端紀錄請至試算表 players 工作表刪除該列" : "已清除你的作答紀錄");
  };
}
function qmsg(t, ok){ const m=$("#qMsg"); m.className = ok?"ok":"err"; m.textContent = t; }
function validateQuestions(arr){
  if(!Array.isArray(arr)) return "題庫必須是陣列";
  if(arr.length < draft.questionCount) return `題庫至少需要 ${draft.questionCount} 題`;
  for(let i=0;i<arr.length;i++){
    const q = arr[i], n = `第 ${i+1} 題`;
    if(!q || typeof q.q !== "string" || !q.q.trim()) return n + "缺少題目文字";
    if(q.type !== "single" && q.type !== "multi") return n + " type 必須是 single 或 multi";
    if(!Array.isArray(q.options) || q.options.length < 2) return n + "至少需要 2 個選項";
    if(!Array.isArray(q.answer) || !q.answer.length) return n + "缺少正確答案";
    if(q.answer.some(a => !Number.isInteger(a) || a < 0 || a >= q.options.length)) return n + "答案索引超出選項範圍";
    if(q.type === "single" && q.answer.length !== 1) return n + "單選題只能有 1 個正確答案";
  }
  return "";
}
function openAdmin(){ draft = clone(site); draftImgs = {...images}; changedImgs = new Set(); renderAdmin(); $("#sheet").classList.add("on"); }
function closeAdmin(){ $("#sheet").classList.remove("on"); }
async function saveAdmin(){
  const b = $("#saveCfg"); b.disabled = true; b.textContent = "儲存中…";
  try{
    await backend.saveSite(draft, draftImgs, [...changedImgs]);
    site = draft; images = draftImgs;
    if(serialStatus) serialStatus.limit = site.serialLimit;
    writeSiteCache({cfg: site, imgs: images, status: serialStatus});
    applySite(); closeAdmin(); toast("已儲存版面與題庫");
  }catch(e){ console.error(e); toast("儲存失敗：" + (e.message || e.code || "請稍後再試")); }
  b.disabled = false; b.textContent = "儲存變更";
}
async function copyConfig(){
  const s = JSON.stringify({...draft, __images: draftImgs});
  try{ await navigator.clipboard.writeText(s); toast("已複製設定 JSON（含圖片）"); }
  catch(e){ $("#adminBody").insertAdjacentHTML("afterbegin", `<div class="field"><label>請手動複製</label><textarea>${escapeHtml(s)}</textarea></div>`); }
}

/* =========================================================
   6. 啟動
   ========================================================= */
function startQuiz(){ buildQuiz(); show("p-quiz"); }
$("#startBtn").addEventListener("click", startQuiz);
$("#replayBtn").addEventListener("click", startQuiz);
$("#retrySerialBtn").addEventListener("click", () => retrySerial(false));
/* 重新取得序號：後端以手機為單位記錄，若先前已發出（只是回應沒送回），會取回同一個序號，不會重複發放 */
let retrying = false;
async function retrySerial(silent){
  if(retrying || !record || !record.error || !record.passed || record.serial != null) return;
  retrying = true;
  const btn = $("#retrySerialBtn"); btn.disabled = true; btn.textContent = "取得中…";
  if(!silent) $("#resNote").textContent = "兌換序號發放中，請稍候…";
  try{
    try{ await backendReady; }catch(e){}
    const rec = await backend.submit(record.rate, record.passed, record.review);
    record = {...rec, repass: false};
    setLocalRecord(record);
    if(record.serial != null && serialStatus) serialStatus.issued = Math.max(serialStatus.issued, record.serial);
    applySite(); renderResult(record, false); updateStartBtn();
    if(!silent && record.serial != null) toast("已取得兌換序號");
  }catch(e){
    if(!silent) toast("仍無法連線，請稍後再按一次「重新取得序號」。");
    renderResult(record, false);
  }finally{ retrying = false; btn.disabled = false; btn.textContent = "重新取得序號"; }
}
$("#mySerialBtn").addEventListener("click", () => { renderResult(record, false, true); show("p-result"); });
$("#submitBtn").addEventListener("click", nextFace);
$("#prevBtn").addEventListener("click", prevFace);
$("#shareIG").addEventListener("click", shareIG);
/* 手機上的臉書分享：臉書 App 不處理網頁版分享網址（只會打開 App），
   因此改用系統分享選單，由玩家選擇 Facebook；不支援時改為複製連結。電腦版維持原本的分享視窗。 */
function isMobileDevice(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
}
$("#shareFB").addEventListener("click", async (e) => {
  if(!isMobileDevice()) return; // 電腦版：開啟臉書分享視窗
  e.preventDefault();
  // 手機：以系統分享選單分享「說明文字＋連結」，由玩家選擇 Facebook
  const url = resultShareUrl(), text = shareText();
  if(navigator.share){
    toast("請在分享選單中選擇 Facebook");
    try{ await navigator.share({ text, url }); return; }
    catch(err){ if(err && err.name === "AbortError") return; }
  }
  let copied = false;
  try{ await navigator.clipboard.writeText(text.trim() + "\n" + url); copied = true; }catch(_){}
  toast(copied ? "分享文字與連結已複製，請開啟臉書並在貼文中貼上。" : "請長按複製後到臉書分享：" + text + " " + url);
});
$("#adminFab").addEventListener("click", openAdmin);
$("#sheetClose").addEventListener("click", closeAdmin);
$("#saveCfg").addEventListener("click", saveAdmin);
$("#copyCfg").addEventListener("click", copyConfig);

if(CONFIG.siteOverrides && CONFIG.siteOverrides.__images){ images = {...CONFIG.siteOverrides.__images}; delete site.__images; }
const BASE_IMAGES = {...images};

/* 開啟速度：先用「本機快取的版面設定＋本機作答紀錄」立即顯示畫面，
   後端（Google Apps Script）在背景載入，有變動時才更新畫面，玩家不必等待。 */
const cachedSite = readSiteCache();
if(cachedSite){
  if(cachedSite.cfg) site = deepMerge(clone(DEFAULT_SITE), cachedSite.cfg);
  if(cachedSite.imgs) images = {...BASE_IMAGES, ...cachedSite.imgs};
  if(cachedSite.status) serialStatus = cachedSite.status;
}
if(!NO_SERIAL) record = getLocalRecord();
applySite();

backendReady = (async () => {
  backend = await initBackend();
  if(backend.mode === "api"){ try{ backend.adminKey = sessionStorage.getItem("quiz_admin_key") || ""; }catch(e){} }
  // 版面設定與作答紀錄同時載入
  const siteTask = (async () => {
    try{
      const {cfg, imgs} = await backend.loadSite();
      let status = null;
      try{ status = await backend.getStatus(); }catch(e){}
      return {cfg: cfg || null, imgs: imgs || {}, status};
    }catch(e){ console.warn("讀取版面設定失敗，沿用目前內容", e); return null; }
  })();
  const recordTask = NO_SERIAL ? Promise.resolve(null)
    : backend.getRecord().catch(e => { console.warn("讀取作答紀錄失敗", e); return null; });
  const [fresh, rec] = await Promise.all([siteTask, recordTask]);
  let changed = false;
  if(fresh){
    const before = JSON.stringify(cachedSite ? {cfg: cachedSite.cfg || null, imgs: cachedSite.imgs || {}, status: cachedSite.status || null} : null);
    const after = JSON.stringify(fresh);
    if(before !== after){
      site = fresh.cfg ? deepMerge(clone(DEFAULT_SITE), fresh.cfg) : deepMerge(clone(DEFAULT_SITE), CONFIG.siteOverrides);
      delete site.__images;
      images = {...BASE_IMAGES, ...fresh.imgs};
      if(fresh.status) serialStatus = fresh.status;
      changed = true;
    }
    writeSiteCache(fresh);
  }
  if(rec && JSON.stringify(rec) !== JSON.stringify(record)){ record = rec; setLocalRecord(rec); changed = true; }
  if(changed) applySite(); else updateStartBtn();
  if(backend.canEdit) $("#adminFab").classList.add("on");
  // 上次序號發放失敗：開啟遊戲時自動向後端重新取得
  if(!NO_SERIAL && record && record.error && record.passed && record.serial == null) retrySerial(true);
  return backend;
})();
</script>
